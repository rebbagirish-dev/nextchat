<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NexChat</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  /* ── Reset & Variables ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-app:       #111B21;
    --bg-chat:      #0B141A;
    --bg-header:    #202C33;
    --bg-panel:     #111B21;
    --bg-input-bar: #202C33;
    --bg-input:     #2A3942;
    --bg-me:        #005C4B;
    --bg-them:      #202C33;
    --accent:       #00A884;
    --accent-light: #25D366;
    --text:         #E9EDEF;
    --text-sub:     #8696A0;
    --text-time:    #8696A0;
    --tick-grey:    #8696A0;
    --tick-blue:    #53BDEB;
    --danger:       #EA3943;
    --divider:      #2A3942;
    --hover:        #2A3942;
    --radius-bubble: 7.5px;
    --font: 'DM Sans', sans-serif;
  }

  html, body { height: 100%; font-family: var(--font); background: var(--bg-app); color: var(--text); overflow: hidden; }

  /* ── Login Screen ── */
  #login-screen {
    position: fixed; inset: 0; background: var(--bg-app);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; flex-direction: column;
    animation: fadeIn .4s ease;
  }
  #login-screen.hidden { display: none; }

  .login-card {
    background: #1a2730;
    border: 1px solid var(--divider);
    border-radius: 16px;
    padding: 40px 36px;
    width: 340px;
    display: flex; flex-direction: column; align-items: center;
    gap: 4px;
    box-shadow: 0 24px 64px rgba(0,0,0,.5);
  }

  .login-icon { font-size: 52px; margin-bottom: 8px; }

  .login-title {
    font-size: 22px; font-weight: 600; color: var(--text);
    letter-spacing: -.3px;
  }
  .login-sub { font-size: 13px; color: var(--text-sub); margin-bottom: 20px; }

  .field-group { width: 100%; margin-bottom: 14px; }
  .field-group label { display: block; font-size: 12px; color: var(--text-sub); margin-bottom: 6px; }
  .field-group input {
    width: 100%;
    background: var(--bg-input);
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 10px 14px;
    font-family: var(--font); font-size: 14px;
    color: var(--text); outline: none;
    transition: border-color .2s;
  }
  .field-group input:focus { border-color: var(--accent); }

  .login-error {
    font-size: 12px; color: var(--danger);
    min-height: 18px; margin-bottom: 8px; text-align: center;
  }

  .btn-login {
    width: 100%; padding: 12px;
    background: var(--accent); color: #fff;
    border: none; border-radius: 8px;
    font-family: var(--font); font-size: 14px; font-weight: 600;
    cursor: pointer; letter-spacing: .5px;
    transition: background .2s, transform .1s;
  }
  .btn-login:hover  { background: var(--accent-light); }
  .btn-login:active { transform: scale(.98); }

  .login-hint {
    margin-top: 18px; font-size: 11px; color: var(--text-sub);
    text-align: center; line-height: 1.7;
  }

  /* ── App Shell ── */
  #app { height: 100vh; display: flex; flex-direction: column; }
  #app.hidden { display: none; }

  /* ── Header ── */
  .chat-header {
    background: var(--bg-header);
    display: flex; align-items: center;
    padding: 8px 16px; gap: 12px;
    min-height: 56px; flex-shrink: 0;
    border-bottom: 1px solid var(--divider);
    position: relative; z-index: 10;
  }

  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 600; color: #fff; flex-shrink: 0;
  }

  .header-info { flex: 1; }
  .header-name { font-size: 15px; font-weight: 600; line-height: 1.2; }
  .header-status { font-size: 12px; color: var(--accent); transition: color .3s; }
  .header-status.offline { color: var(--text-sub); }

  .header-actions { display: flex; gap: 4px; }

  .icon-btn {
    background: none; border: none; color: var(--text-sub);
    font-size: 20px; cursor: pointer; padding: 6px 8px;
    border-radius: 6px; transition: background .15s, color .15s;
    display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:hover { background: var(--hover); color: var(--text); }

  /* Dropdown menu */
  .dropdown { position: relative; }
  .dropdown-menu {
    display: none; position: absolute; right: 0; top: 110%;
    background: #233138; border-radius: 6px;
    min-width: 180px; z-index: 200;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
    overflow: hidden;
  }
  .dropdown-menu.open { display: block; animation: slideDown .15s ease; }
  .dropdown-menu button {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 12px 16px;
    background: none; border: none; color: var(--text);
    font-family: var(--font); font-size: 14px;
    cursor: pointer; text-align: left;
    transition: background .15s;
  }
  .dropdown-menu button:hover { background: var(--hover); }
  .dropdown-menu button.danger { color: var(--danger); }
  .dropdown-menu hr { border: none; border-top: 1px solid var(--divider); }

  /* ── Chat area ── */
  #chat-area {
    flex: 1; overflow-y: auto; padding: 12px 5%;
    background: var(--bg-chat);
    background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.02'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    scroll-behavior: smooth;
  }
  #chat-area::-webkit-scrollbar { width: 5px; }
  #chat-area::-webkit-scrollbar-track { background: transparent; }
  #chat-area::-webkit-scrollbar-thumb { background: #374045; border-radius: 4px; }

  /* Date divider */
  .date-divider {
    text-align: center; margin: 12px 0;
  }
  .date-divider span {
    background: #182229; color: var(--text-sub);
    font-size: 11.5px; padding: 4px 12px;
    border-radius: 8px; display: inline-block;
  }

  /* Bubbles */
  .msg-row {
    display: flex; margin-bottom: 3px;
    animation: bubbleIn .2s ease;
  }
  .msg-row.me    { justify-content: flex-end; }
  .msg-row.them  { justify-content: flex-start; }

  .bubble {
    max-width: 65%; padding: 7px 10px 6px 10px;
    border-radius: var(--radius-bubble);
    position: relative; word-break: break-word;
    line-height: 1.45;
  }
  .msg-row.me   .bubble { background: var(--bg-me);   border-bottom-right-radius: 2px; }
  .msg-row.them .bubble { background: var(--bg-them); border-bottom-left-radius: 2px; }

  .bubble-body { font-size: 14.2px; color: var(--text); }

  .bubble-footer {
    display: flex; align-items: center; justify-content: flex-end;
    gap: 3px; margin-top: 3px;
  }
  .bubble-time { font-size: 11px; color: var(--text-time); }

  .tick { font-size: 13px; color: var(--tick-grey); line-height: 1; }
  .tick.read   { color: var(--tick-blue); }

  /* ── Input bar ── */
  .input-bar {
    background: var(--bg-input-bar);
    display: flex; align-items: center;
    padding: 8px 16px; gap: 10px;
    border-top: 1px solid var(--divider); flex-shrink: 0;
  }

  #msg-input {
    flex: 1; background: var(--bg-input);
    border: none; border-radius: 24px;
    padding: 10px 18px;
    font-family: var(--font); font-size: 14.5px;
    color: var(--text); outline: none;
    resize: none; max-height: 120px; overflow-y: auto;
    line-height: 1.45;
  }
  #msg-input::placeholder { color: var(--text-sub); }
  #msg-input::-webkit-scrollbar { width: 3px; }

  .send-btn {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--accent); border: none;
    color: #fff; font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s, transform .1s; flex-shrink: 0;
  }
  .send-btn:hover  { background: var(--accent-light); }
  .send-btn:active { transform: scale(.9); }

  /* ── Confirm modal ── */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.6); z-index: 500;
    align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; animation: fadeIn .2s; }
  .modal {
    background: #233138; border-radius: 12px;
    padding: 28px 28px 22px; max-width: 320px; width: 90%;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .modal h3 { font-size: 16px; margin-bottom: 8px; }
  .modal p  { font-size: 13px; color: var(--text-sub); margin-bottom: 22px; line-height: 1.6; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
  .btn-cancel {
    padding: 9px 18px; background: none; border: 1px solid var(--divider);
    border-radius: 8px; color: var(--text); font-family: var(--font);
    font-size: 13px; cursor: pointer; transition: background .15s;
  }
  .btn-cancel:hover { background: var(--hover); }
  .btn-confirm {
    padding: 9px 18px; background: var(--danger); border: none;
    border-radius: 8px; color: #fff; font-family: var(--font);
    font-size: 13px; font-weight: 600; cursor: pointer;
    transition: opacity .15s;
  }
  .btn-confirm:hover { opacity: .85; }

  /* ── Animations ── */
  @keyframes fadeIn    { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideDown { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
  @keyframes bubbleIn  { from { opacity:0; transform:translateY(6px) scale(.97); } to { opacity:1; transform:none; } }

  .hidden { display: none !important; }

  /* ── Empty state ── */
  .empty-chat {
    height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
    color: var(--text-sub);
  }
  .empty-chat .icon { font-size: 52px; opacity: .3; }
  .empty-chat p { font-size: 14px; opacity: .5; }
</style>
</head>
<body>

<!-- ══════════ LOGIN ══════════ -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-icon">💬</div>
    <div class="login-title">NexChat</div>
    <div class="login-sub">Sign in to continue</div>

    <div class="field-group">
      <label>Username</label>
      <input type="text" id="username" placeholder="Enter username" autocomplete="off"/>
    </div>
    <div class="field-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter password"/>
    </div>

    <div class="login-error" id="login-error"></div>
    <button class="btn-login" id="login-btn">SIGN IN</button>

    <div class="login-hint">
      Alice / alice123 &nbsp;·&nbsp; Bob / bob123
    </div>
  </div>
</div>

<!-- ══════════ CHAT APP ══════════ -->
<div id="app" class="hidden">

  <!-- Header -->
  <div class="chat-header">
    <div class="avatar" id="other-avatar">?</div>
    <div class="header-info">
      <div class="header-name" id="other-name">—</div>
      <div class="header-status" id="other-status">online</div>
    </div>
    <div class="header-actions">
      <div class="dropdown" id="menu-dropdown">
        <button class="icon-btn" id="menu-btn" title="Menu">⋮</button>
        <div class="dropdown-menu" id="dropdown-menu">
          <button id="clear-btn">🗑&nbsp; Clear Chat History</button>
          <hr/>
          <button id="logout-btn" class="danger">🚪&nbsp; Log Out</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Messages -->
  <div id="chat-area">
    <div class="empty-chat" id="empty-state">
      <div class="icon">💬</div>
      <p>No messages yet. Say hello!</p>
    </div>
  </div>

  <!-- Input -->
  <div class="input-bar">
    <textarea id="msg-input" rows="1" placeholder="Type a message"></textarea>
    <button class="send-btn" id="send-btn">➤</button>
  </div>
</div>

<!-- Clear confirm modal -->
<div class="modal-overlay" id="clear-modal">
  <div class="modal">
    <h3>Clear Chat History</h3>
    <p>All messages will be permanently deleted for both users. This cannot be undone.</p>
    <div class="modal-actions">
      <button class="btn-cancel" id="modal-cancel">Cancel</button>
      <button class="btn-confirm" id="modal-confirm">Delete All</button>
    </div>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────────
let myId       = null;
let myUsername = null;
let pollTimer  = null;
let lastMsgId  = 0;

// ── Login ──────────────────────────────────────────────────────────────────────
async function login() {
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();
  const errEl    = document.getElementById("login-error");

  if (!username || !password) {
    errEl.textContent = "Please enter username and password.";
    return;
  }
  errEl.textContent = "";

  const res  = await fetch("/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username, password })
  });
  const data = await res.json();

  if (data.ok) {
    myUsername = data.username;
    await initApp();
  } else {
    errEl.textContent = data.error || "Login failed.";
    document.getElementById("password").value = "";
  }
}

document.getElementById("login-btn").addEventListener("click", login);
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && !document.getElementById("login-screen").classList.contains("hidden")) {
    login();
  }
});

// ── Init app after login ───────────────────────────────────────────────────────
async function initApp() {
  const meRes  = await fetch("/api/me");
  const me     = await meRes.json();
  if (!me.logged_in) { showLogin(); return; }
  myId       = me.user_id;
  myUsername = me.username;

  const otherRes = await fetch("/api/other");
  const other    = await otherRes.json();

  document.getElementById("other-name").textContent   = other.username || "—";
  document.getElementById("other-avatar").textContent = (other.username || "?")[0].toUpperCase();
  updateStatus(other.online, other.last_seen);

  document.getElementById("login-screen").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");

  await loadMessages();
  startPolling();
}

// ── Status ─────────────────────────────────────────────────────────────────────
function updateStatus(online, lastSeen) {
  const el = document.getElementById("other-status");
  if (online) {
    el.textContent = "online";
    el.classList.remove("offline");
  } else {
    el.textContent = lastSeen ? `last seen ${lastSeen}` : "offline";
    el.classList.add("offline");
  }
}

// ── Load messages ──────────────────────────────────────────────────────────────
async function loadMessages() {
  const res  = await fetch("/api/messages");
  const msgs = await res.json();

  const area  = document.getElementById("chat-area");
  const empty = document.getElementById("empty-state");

  if (msgs.length === 0) {
    area.innerHTML = "";
    area.appendChild(empty);
    empty.classList.remove("hidden");
    lastMsgId = 0;
    return;
  }

  // Check if we need to re-render (new messages or status changed)
  const latestId     = msgs[msgs.length - 1].id;
  const latestStatus = msgs[msgs.length - 1].status;
  const prevKey      = area.dataset.renderKey || "";
  const newKey       = `${latestId}_${latestStatus}`;

  if (prevKey === newKey) return; // nothing changed
  area.dataset.renderKey = newKey;

  const atBottom = area.scrollHeight - area.clientHeight - area.scrollTop < 80;

  area.innerHTML = "";

  // Date divider (just "Today" for simplicity)
  const divEl = document.createElement("div");
  divEl.className = "date-divider";
  divEl.innerHTML = "<span>Today</span>";
  area.appendChild(divEl);

  msgs.forEach(msg => {
    const isMe = (msg.sender_id === myId);
    const row  = document.createElement("div");
    row.className = `msg-row ${isMe ? "me" : "them"}`;

    let tickHtml = "";
    if (isMe) {
      if (msg.status === "read") {
        tickHtml = `<span class="tick read" title="Read">✓✓</span>`;
      } else if (msg.status === "delivered") {
        tickHtml = `<span class="tick" title="Delivered">✓✓</span>`;
      } else {
        tickHtml = `<span class="tick" title="Sent">✓</span>`;
      }
    }

    row.innerHTML = `
      <div class="bubble">
        <div class="bubble-body">${escHtml(msg.body)}</div>
        <div class="bubble-footer">
          <span class="bubble-time">${msg.timestamp}</span>
          ${tickHtml}
        </div>
      </div>`;
    area.appendChild(row);
  });

  lastMsgId = latestId;

  if (atBottom || prevKey === "") {
    area.scrollTop = area.scrollHeight;
  }
}

function escHtml(str) {
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;")
            .replace(/>/g,"&gt;").replace(/\n/g,"<br/>");
}

// ── Send ───────────────────────────────────────────────────────────────────────
async function sendMessage() {
  const input = document.getElementById("msg-input");
  const body  = input.value.trim();
  if (!body) return;
  input.value = "";
  input.style.height = "auto";

  await fetch("/api/send", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ body })
  });
  await loadMessages();
}

document.getElementById("send-btn").addEventListener("click", sendMessage);
document.getElementById("msg-input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
// Auto-resize textarea
document.getElementById("msg-input").addEventListener("input", function() {
  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight, 120) + "px";
});

// ── Polling ────────────────────────────────────────────────────────────────────
function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    try {
      const res  = await fetch("/api/poll");
      const data = await res.json();
      if (!data) return;
      updateStatus(data.other_online, data.other_last_seen);
      await loadMessages();
    } catch (_) {}
  }, 1500);
}

// ── Dropdown menu ──────────────────────────────────────────────────────────────
document.getElementById("menu-btn").addEventListener("click", e => {
  e.stopPropagation();
  document.getElementById("dropdown-menu").classList.toggle("open");
});
document.addEventListener("click", () => {
  document.getElementById("dropdown-menu").classList.remove("open");
});

// ── Clear history ──────────────────────────────────────────────────────────────
document.getElementById("clear-btn").addEventListener("click", () => {
  document.getElementById("clear-modal").classList.add("open");
});
document.getElementById("modal-cancel").addEventListener("click", () => {
  document.getElementById("clear-modal").classList.remove("open");
});
document.getElementById("modal-confirm").addEventListener("click", async () => {
  await fetch("/api/clear", { method: "POST" });
  document.getElementById("clear-modal").classList.remove("open");
  await loadMessages();
});

// ── Logout ─────────────────────────────────────────────────────────────────────
document.getElementById("logout-btn").addEventListener("click", async () => {
  if (pollTimer) clearInterval(pollTimer);
  await fetch("/logout", { method: "POST" });
  showLogin();
});

function showLogin() {
  document.getElementById("app").classList.add("hidden");
  document.getElementById("login-screen").classList.remove("hidden");
  document.getElementById("username").value = "";
  document.getElementById("password").value = "";
  document.getElementById("login-error").textContent = "";
  myId = null;
}

// ── Auto-init if already logged in ────────────────────────────────────────────
(async () => {
  const res  = await fetch("/api/me");
  const data = await res.json();
  if (data.logged_in) {
    await initApp();
  }
})();
</script>
</body>
</html>
